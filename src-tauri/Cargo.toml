[package]
name = "digital-guaiguai"
version = "0.1.0"
description = "Digital GuaiGuai — green 乖乖 desktop pet companion"
authors = ["Digital GuaiGuai"]
edition = "2021"

[lib]
name = "digital_guaiguai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
